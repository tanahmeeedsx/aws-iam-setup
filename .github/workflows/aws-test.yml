name: AWS OIDC Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC request URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token exists: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530629633924:role/github-actions-s3-role
          aws-region: us-east-1

      - name: Test AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Test S3 Access
        run: |
          aws s3 ls
